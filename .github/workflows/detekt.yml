name: Code Quality Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.kt'
      - '**.kts'
      - '**/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'config/detekt/**'
  push:
    branches: [main]
    paths:
      - '**.kt'
      - '**.kts'
      - '**/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'config/detekt/**'

concurrency:
  group: detekt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detekt:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run detekt
        run: ./gradlew detekt --continue

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports-${{ github.sha }}
          path: |
            app/build/reports/detekt/
            build/reports/detekt/

      - name: Publish detekt report comment (PR only)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let detektMessage = '## 🔍 Detekt Code Quality Report\n\n';
            const detektReportPath = 'app/build/reports/detekt/detekt.txt';

            if (fs.existsSync(detektReportPath)) {
              const report = fs.readFileSync(detektReportPath, 'utf8');
              const lines = report.split('\n');
              const summaryLine = lines.find(line => line.includes('issues found'));

              if (summaryLine && summaryLine.includes('0 issues found')) {
                detektMessage += '✅ **No issues found!** Code quality check passed.\n';
              } else {
                detektMessage += '⚠️ **Issues detected**\n\n';
                detektMessage += '```\n' + report.substring(0, 3000) + '\n```\n';
                if (report.length > 3000) {
                  detektMessage += '\n*Report truncated. See full report in artifacts.*\n';
                }
              }
            } else {
              detektMessage += '✅ **Detekt check completed**\n';
            }

            detektMessage += '\n---\n';
            detektMessage += `📎 [View Full Report in Artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: detektMessage
            });