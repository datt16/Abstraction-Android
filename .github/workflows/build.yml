name: Build & Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: |
            app/build/test-results/
            app/build/reports/tests/

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk

      - name: Comment PR with build status
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ job.status }}';
            const prNumber = context.issue.number;

            let message = '## 🏗️ Build & Test Report\n\n';

            if (outcome === 'success') {
              message += '✅ **Build Status**: Success\n\n';
              message += '### 📦 Artifacts\n';
              message += '- Debug APK available in artifacts\n';
              message += '- Test reports available in artifacts\n\n';

              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              message += `### 📥 Download\n`;
              message += `[Download APK and test results from workflow artifacts](${runUrl})\n`;
            } else if (outcome === 'failure') {
              message += '❌ **Build Status**: Failed\n\n';
              message += 'Please check the workflow logs for details.\n';
            } else {
              message += '⚠️ **Build Status**: ' + outcome + '\n';
            }

            message += '\n---\n';
            message += `🔗 [View Workflow Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      - name: Generate build report
        if: github.ref == 'refs/heads/main'
        run: |
          echo "# Build Report" > build-report.md
          echo "" >> build-report.md
          echo "## Build Information" >> build-report.md
          echo "- **Branch**: ${{ github.ref_name }}" >> build-report.md
          echo "- **Commit**: ${{ github.sha }}" >> build-report.md
          echo "- **Author**: ${{ github.actor }}" >> build-report.md
          echo "- **Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> build-report.md
          echo "" >> build-report.md

          if [ -d app/build/outputs/apk/debug ]; then
            echo "## APK Details" >> build-report.md
            echo "### Debug APK" >> build-report.md
            ls -lh app/build/outputs/apk/debug/*.apk | awk '{print "- Size: " $5}' >> build-report.md
          fi

          if [ -d app/build/outputs/apk/release ]; then
            echo "### Release APK" >> build-report.md
            ls -lh app/build/outputs/apk/release/*.apk | awk '{print "- Size: " $5}' >> build-report.md
          fi

      - name: Upload build report
        if: github.ref == 'refs/heads/main' && always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ github.sha }}
          path: build-report.md

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false