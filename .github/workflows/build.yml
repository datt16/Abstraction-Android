name: Build & Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build-status: ${{ steps.build-status.outputs.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use CI gradle.properties
        run: cp gradle.properties.action gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk

      - name: Set build status output
        id: build-status
        if: always()
        run: echo "status=${{ job.status }}" >> $GITHUB_OUTPUT

      - name: Generate build report
        if: github.ref == 'refs/heads/main'
        run: |
          echo "# Build Report" > build-report.md
          echo "" >> build-report.md
          echo "## Build Information" >> build-report.md
          echo "- **Branch**: ${{ github.ref_name }}" >> build-report.md
          echo "- **Commit**: ${{ github.sha }}" >> build-report.md
          echo "- **Author**: ${{ github.actor }}" >> build-report.md
          echo "- **Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> build-report.md
          echo "" >> build-report.md

          if [ -d app/build/outputs/apk/debug ]; then
            echo "## APK Details" >> build-report.md
            echo "### Debug APK" >> build-report.md
            ls -lh app/build/outputs/apk/debug/*.apk | awk '{print "- Size: " $5}' >> build-report.md
          fi

          if [ -d app/build/outputs/apk/release ]; then
            echo "### Release APK" >> build-report.md
            ls -lh app/build/outputs/apk/release/*.apk | awk '{print "- Size: " $5}' >> build-report.md
          fi

      - name: Upload build report
        if: github.ref == 'refs/heads/main' && always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ github.sha }}
          path: build-report.md

  test:
    needs: build
    if: needs.build.outputs.build-status == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use CI gradle.properties
        run: cp gradle.properties.action gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: |
            app/build/test-results/
            app/build/reports/tests/

  detekt:
    needs: build
    if: needs.build.outputs.build-status == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use CI gradle.properties
        run: cp gradle.properties.action gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run detekt
        run: ./gradlew detekt --continue

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports-${{ github.sha }}
          path: |
            app/build/reports/detekt/
            build/reports/detekt/

  roborazzi_store:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use CI gradle.properties
        run: cp gradle.properties.action gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Record Roborazzi baseline (Debug)
        run: ./gradlew recordRoborazziDebug

      - name: Upload Roborazzi baseline
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-baseline
          path: app/build/outputs/roborazzi
          retention-days: 30

  roborazzi_compare:
    needs: build
    if: github.event_name == 'pull_request' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use CI gradle.properties
        run: cp gradle.properties.action gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Download baseline from main
        id: download_baseline
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: build.yml
          branch: main
          name: roborazzi-baseline
          path: app/build/outputs/roborazzi

      - name: Compare Roborazzi snapshots
        if: steps.download_baseline.outcome == 'success'
        run: ./gradlew verifyRoborazziDebug

      - name: Record Roborazzi (no baseline)
        if: steps.download_baseline.outcome != 'success'
        run: ./gradlew recordRoborazziDebug

      - name: Upload Roborazzi outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-outputs-${{ github.sha }}
          path: |
            app/build/outputs/roborazzi
            app/build/reports/roborazzi

      - name: Comment PR with Roborazzi report
        if: always()
        uses: actions/github-script@v7
        env:
          BASELINE_OUTCOME: ${{ steps.download_baseline.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- ROBORAZZI_REPORT -->';
            const prNumber = context.issue.number;
            const baseDir = path.join(process.cwd(), 'app', 'build', 'outputs', 'roborazzi');

            const listFiles = (dir) => {
              if (!fs.existsSync(dir)) return [];
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              return entries.flatMap((entry) => {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) return listFiles(full);
                return [full];
              });
            };

            const files = listFiles(baseDir);
            const compareFiles = files.filter((f) => f.toLowerCase().endsWith('compare.png'));
            const baseFound = process.env.BASELINE_OUTCOME === 'success';

            let body = `${marker}\n## 📸 Roborazzi Report\n`;
            body += baseFound ? 'Baseline: ✅ main から取得\n' : 'Baseline: ⚠️ 取得できず（初回かも）\n';

            if (compareFiles.length === 0) {
              body += '\n差分は検出されませんでした。\n';
            } else {
              const maxShow = 3;
              body += `\n差分 ${compareFiles.length} 件を検出。先頭 ${Math.min(compareFiles.length, maxShow)} 件を表示します。\n`;
              compareFiles.slice(0, maxShow).forEach((file) => {
                const rel = path.relative(baseDir, file);
                const data = fs.readFileSync(file, { encoding: 'base64' });
                body += `\n<details><summary>${rel}</summary>\n\n<img src="data:image/png;base64,${data}" alt="${rel}" />\n</details>\n`;
              });
              if (compareFiles.length > maxShow) {
                body += `\n…他 ${compareFiles.length - maxShow} 件はArtifactsを参照してください。\n`;
              }
            }

            body += `\n[Workflow Run Link](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const existing = comments.find(
              (c) =>
                c.user?.login === 'github-actions[bot]' &&
                c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

  report:
    needs: [build, test, detekt]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Comment PR with CI status
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- CI_REPORT -->';
            const buildStatus = '${{ needs.build.result }}';
            const testStatus = '${{ needs.test.result }}';
            const detektStatus = '${{ needs.detekt.result }}';
            const prNumber = context.issue.number;

            let message = `${marker}\n## 🤖 CI Report\n\n`;

            // Build status
            message += '### Build\n';
            if (buildStatus === 'success') {
              message += '✅ Build completed successfully\n';
            } else if (buildStatus === 'failure') {
              message += '❌ Build failed\n';
            } else if (buildStatus === 'skipped') {
              message += '⏭️ Build was skipped\n';
            } else {
              message += '⚠️ Build status: ' + buildStatus + '\n';
            }

            // Test status
            message += '\n### Tests\n';
            if (testStatus === 'success') {
              message += '✅ All tests passed\n';
            } else if (testStatus === 'failure') {
              message += '❌ Tests failed\n';
            } else if (testStatus === 'skipped') {
              message += '⏭️ Tests were skipped (build failed)\n';
            } else {
              message += '⚠️ Test status: ' + testStatus + '\n';
            }

            // Detekt status
            message += '\n### Code Quality (Detekt)\n';
            if (detektStatus === 'success') {
              message += '✅ Code quality check passed\n';
            } else if (detektStatus === 'failure') {
              message += '❌ Code quality issues found\n';
            } else if (detektStatus === 'skipped') {
              message += '⏭️ Detekt was skipped (build failed)\n';
            } else {
              message += '⚠️ Detekt status: ' + detektStatus + '\n';
            }

            if (buildStatus === 'success') {
              message += '\n### 📦 Artifacts\n';
              message += '- Debug APK available in artifacts\n';

              if (testStatus === 'success' || testStatus === 'failure') {
                message += '- Test reports available in artifacts\n';
              }

              if (detektStatus === 'success' || detektStatus === 'failure') {
                message += '- Detekt reports available in artifacts\n';
              }
            }

            message += '\n---\n';
            message += `🔗 [View Workflow Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const existing = comments.find(
              (c) =>
                c.user?.login === 'github-actions[bot]' &&
                c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: message,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message,
              });
            }

  release:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: '*-apk-*'
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.apk
          generate_release_notes: true
          draft: false
          prerelease: false
